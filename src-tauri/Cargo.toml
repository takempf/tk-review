[package]
name = "tk-review"
version = "0.1.0"
description = "Local git diff / PR review tool"
edition = "2021"
rust-version = "1.95"

[lib]
name = "tk_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.3", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.4", features = [] }
# Depending on this crate is what selects the Chromium runtime: tauri-build and
# the Tauri CLI detect it from this manifest, and only then ship the CEF binary
# distribution, sign it with the entitlements Chromium needs, and run `tauri dev`
# from inside an .app bundle on macOS.
tauri-runtime-cef = "3.0.0-alpha.5"
tauri-plugin-dialog = "3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# `kill`, to stop an agent CLI and everything it started. Already in the tree.
libc = "0.2"
# Where Chromium's profile goes. Already in the tree through tauri-runtime-cef.
dirs = "6"
tauri-plugin-opener = "3.0.0-alpha.2"

[dev-dependencies]
tempfile = "3"
