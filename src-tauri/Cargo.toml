[package]
name = "tk-review"
version = "0.1.0"
description = "Local git diff / PR review tool"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tk_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
