[package]
name = "tk-review"
version = "0.1.0"
description = "Local git diff / PR review tool"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tk_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# `kill`, to stop an agent CLI and everything it started. Already in the tree.
libc = "0.2"
tauri-plugin-opener = "2"

# The WKWebView under the window, for the settings Tauri doesn't expose: the
# trackpad's back/forward swipe, and the display's frame rate. Already in the
# tree through wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-web-kit = { version = "0.3", features = [
  "WKPreferences",
  "WKWebView",
  "WKWebViewConfiguration",
] }

[dev-dependencies]
tempfile = "3"
