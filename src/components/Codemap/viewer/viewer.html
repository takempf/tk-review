<!doctype html>
<html lang="en" data-tk-theme="base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codemap</title>
<style>
/*__STYLES__*/
</style>
<style>
/* A full-bleed canvas under one toolbar, with panels pinned to its corners, drawn from the review's design-system tokens, which the host sets on :root. */
[hidden]{display:none!important}
:root{color-scheme:dark;--bar-h:2.5rem;--zoom-h:1.5rem;--overview-h:calc(150px + var(--zoom-h) + 3px)}
:root:has(#br[data-collapsed]){--overview-h:calc(var(--zoom-h) + 2px)}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg-code);color:var(--text);font-family:var(--tk-font-sans);font-size:var(--tk-text-sm);font-feature-settings:"ss09";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#cv.grab{cursor:grabbing}
.panel{position:fixed;background:var(--bg);border:1px solid var(--border);border-radius:var(--tk-radius);box-shadow:0 8px 24px rgb(0 0 0 / .35)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:var(--tk-focus-width) solid var(--tk-focus-color);outline-offset:var(--tk-focus-offset)}
/* Section labels, as the file list and commits are headed. */
.sec h4{margin:0;color:var(--tk-label);font-family:var(--tk-type-label-font);font-size:var(--tk-text-xs);font-weight:var(--tk-type-label-weight);font-stretch:var(--tk-type-label-stretch);letter-spacing:var(--tk-type-label-tracking);text-transform:var(--tk-type-label-transform)}
.mono{font-family:var(--tk-font-mono)}
/* The viewer marks pressed toggles with aria-pressed rather than data-pressed. */
.tk-toggle[aria-pressed=true]{background:var(--tk-primary);color:var(--tk-primary-fg)}
.tk-toggle-group{flex:none}

/* toolbar */
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:6px var(--tk-space-1);padding:6px calc(var(--tk-space-2) + env(safe-area-inset-right,0px)) 6px calc(var(--tk-space-2) + env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--border)}
.search{position:relative;flex:1 1 150px;max-width:240px;margin-right:var(--tk-space-2)}
#q{width:100%;padding-left:28px;font-size:var(--tk-text-xs)}
.search>svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.bar-trigger{flex:none;gap:var(--tk-space-2);padding-inline:var(--tk-space-2)}
.bar-trigger[data-popup-open]{background:var(--tk-surface-hover);border-color:var(--tk-border-subtle);color:var(--tk-fg)}
.bar-trigger>.tk-icon{color:var(--text-faint)}
.bar-trigger>.bar-chevron{margin-left:calc(var(--tk-space-1) * -1)}
.bar-value{max-width:18ch;overflow:hidden;text-overflow:ellipsis}
.bar-badge{min-width:1.15rem;padding:1px 4px;border-radius:var(--tk-radius);background:var(--tk-primary);color:var(--tk-primary-fg);font-family:var(--tk-font-mono);font-size:10px;text-align:center}
#seg-view{margin-left:auto}
/* Menus are native popovers placed under their trigger, wearing the design system's list popup. */
.menu{inset:auto;margin:0}
button.tk-list-item{width:100%;border:0;background:none;font:inherit;text-align:start}
.tk-list-item[aria-checked=false]>.tk-list-indicator{opacity:0;scale:.5}
.tk-list-item .dot{display:inline-block;margin-right:8px;vertical-align:-1px}
.tk-list-trailing{font-family:var(--tk-font-mono);font-size:10.5px}
.tk-list-item .only{display:none;color:var(--accent);font-family:var(--tk-font-sans);font-size:var(--tk-text-xs)}
.tk-list-item:hover .only{display:inline}
.tk-list-item:hover .only~.ct{display:none}
.menu-note{max-width:20rem;padding:var(--tk-space-2) var(--tk-space-3);color:var(--text-dim);font-size:var(--tk-text-xs);line-height:1.45}
.menu-note b{color:var(--tk-purple);font-weight:600}
.menu-note .legend+.legend{margin-top:6px}
.kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--tk-font-mono);font-size:10px;color:var(--text-faint);border:1px solid var(--border-strong);border-radius:var(--tk-radius);padding:0 4px;pointer-events:none}
#results{position:absolute;top:calc(100% + 6px);left:0;width:min(440px,86vw);max-height:60vh;overflow:auto;padding:4px}
.res{display:flex;gap:9px;align-items:center;padding:6px 8px;cursor:pointer}
.res.on,.res:hover{background:var(--bg-hover)}
.res .nm{font-family:var(--tk-font-sans);font-size:12.5px;white-space:nowrap}
.res .dr{font-family:var(--tk-font-sans);font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;direction:rtl;text-align:left}
.dot{width:9px;height:9px;border-radius:2px;flex:none}
.res .ln{margin-left:auto;font-family:var(--tk-font-mono);font-size:10.5px;color:var(--text-faint);padding-left:8px}
.empty{padding:10px;color:var(--text-dim);font-size:12.5px}

/* Switches, built like the design system's: square, filled with the primary colour when on. */
.tg{display:flex;align-items:center;gap:var(--tk-space-2);background:none;border:0;padding:2px 0;color:var(--text-dim);font-size:var(--tk-text-xs);cursor:pointer}
.tg:hover{color:var(--text)}
.tg .bx{position:relative;flex:none;width:1.9rem;height:1.05rem;border:var(--tk-border-width) solid var(--border-strong);border-radius:var(--tk-radius);background:var(--tk-surface);transition:background-color var(--tk-duration-2) var(--tk-ease-out),border-color var(--tk-duration-2) var(--tk-ease-out)}
.tg .bx::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.05rem - 6px);height:calc(1.05rem - 6px);border-radius:var(--tk-knob-radius);background:var(--text-dim);transition:translate var(--tk-duration-2) var(--tk-ease-out),background-color var(--tk-duration-2) var(--tk-ease-out)}
.tg[aria-pressed=true] .bx{background:var(--tk-primary);border-color:var(--tk-primary)}
.tg[aria-pressed=true] .bx::after{translate:calc(1.9rem - 1.05rem) 0;background:var(--tk-primary-fg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--text-dim)}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}

/* bottom-right: the overview map over a strip of zoom controls, resting on a contact shadow that stays under its bottom edge */
#br{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:1px solid var(--border);border-radius:var(--tk-radius);box-shadow:0 2px 0 -1px rgb(0 0 0 / .35),0 4px 6px -3px rgb(0 0 0 / .5)}
#nav{box-sizing:content-box;width:220px;height:150px;display:block;cursor:crosshair;background:var(--bg-sunken);border-bottom:1px solid var(--border)}
#br[data-collapsed] #nav{display:none}
.zoom{display:flex;align-items:center}
.zoom .tk-button{--_h:var(--zoom-h)}
#zl{font-family:var(--tk-font-mono);font-size:11px;color:var(--text-dim);min-width:44px;text-align:center}
#zfit{margin-left:auto;padding-inline:var(--tk-space-2)}
#br:not([data-collapsed]) #navtoggle{position:absolute;top:0;right:0;--_h:1.25rem;background:var(--bg);border-color:transparent transparent var(--border) var(--border)}
#br:not([data-collapsed]) #navtoggle:hover{background:var(--bg-hover)}
#br[data-collapsed] #navtoggle .tk-icon{rotate:180deg}
#stat{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--tk-font-mono);font-size:10.5px;color:var(--text-dim);text-align:center;line-height:1.3;white-space:nowrap;pointer-events:none}

/* detail drawer */
#detail{top:calc(var(--bar-h) + 12px);right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(var(--overview-h) + 24px + env(safe-area-inset-bottom,0px));width:360px;display:flex;flex-direction:column;overflow:hidden}
.dh{padding:14px 14px 10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.dh-top{display:flex;align-items:flex-start;gap:10px}
.dh-top canvas{flex:none}
.dh h2{margin:0;font-family:var(--tk-font-sans);font-size:15px;font-weight:700;word-break:break-all;line-height:1.3;text-wrap:balance}
.path{font-family:var(--tk-font-sans);font-size:11px;color:var(--text-dim);word-break:break-all;user-select:text}
#dclose{margin-left:auto;background:none;border:0;color:var(--text-dim);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px}
#dclose:hover{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--tk-radius);padding:6px 8px}
.stat b{display:block;font-family:var(--tk-font-mono);font-size:14px}
.stat span{font-size:10.5px;color:var(--text-dim)}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-size:11px;border:1px solid var(--border-strong);border-radius:var(--tk-radius);padding:1px 6px;color:var(--text-dim)}
.badge.warn{color:var(--tk-yellow);border-color:color-mix(in oklab,var(--tk-yellow) 40%,var(--bg))}
.dacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dbody{overflow:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sec h4{margin:10px 0 6px;display:flex;gap:6px;align-items:center}
.sec h4 i{width:10px;height:2px}
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px;padding:4px 6px;cursor:pointer;min-width:0}
.li:hover{background:var(--bg-hover)}
.li .nm{font-family:var(--tk-font-sans);font-size:12px;white-space:nowrap}
.li .dr{font-family:var(--tk-font-sans);font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;direction:rtl;text-align:left;flex:1}
.li .kd{font-size:10px;color:var(--text-dim);border:1px solid var(--border-strong);border-radius:var(--tk-radius);padding:0 4px;flex:none}
.more{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12px;padding:4px 6px;text-align:left}
.pk{display:flex;flex-wrap:wrap;gap:4px}
.pk span{font-family:var(--tk-font-mono);font-size:11px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--tk-radius);padding:1px 6px;color:var(--text)}
.mmwrap{background:var(--bg-sunken);border:1px solid var(--border);padding:8px;overflow:hidden}
.mmwrap canvas{display:block;image-rendering:pixelated;width:240px;max-width:100%}
.note{font-size:11.5px;color:var(--text-dim);line-height:1.45}
.note.warn{color:var(--tk-yellow)}
.mut{color:var(--text-dim)}
.picwrap{border:1px solid var(--border);padding:10px;background:repeating-conic-gradient(var(--bg-raised) 0 25%,var(--bg-hover) 0 50%) 0 0/16px 16px}
.picwrap img{display:block;max-width:100%;max-height:260px;margin:0 auto}
#tip{position:fixed;pointer-events:none;z-index:20;padding:7px 9px;max-width:420px}
#tip .nm{font-family:var(--tk-font-sans);font-size:12.5px;font-weight:700}
#tip .dr{font-family:var(--tk-font-sans);font-size:11px;color:var(--text-dim);word-break:break-all}
#tip .mt{font-size:11.5px;color:var(--text-dim);margin-top:3px}
#hint{left:50%;transform:translateX(-50%);bottom:calc(48px + env(safe-area-inset-bottom,0px));padding:7px 12px;font-size:12px;color:var(--text-dim);transition:opacity .6s;white-space:nowrap}
#hint b{color:var(--text);font-weight:600}
#impact{top:calc(var(--bar-h) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 12px;max-width:min(760px,calc(100vw - 24px));z-index:12;border-color:var(--border-strong)}
#impact .ib-t{font-size:13.5px}
#impact .ib-t code{font-family:var(--tk-font-sans);font-size:12.5px;color:var(--tk-fg-bright)}
#impact .ib-m{font-family:var(--tk-font-mono);font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#impact .ib-h{font-size:11px;color:var(--text-faint);margin-top:2px}
#impact .tk-button{flex:none}

@media (max-width:1180px){#hint{display:none}}
/* A bar too narrow for every label keeps only the icons of the menus that name a category. */
#bar.compact .bar-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#bar.compact .bar-value{max-width:12ch}
@media (max-width:760px){
  #br{top:calc(var(--bar-h) + 12px);bottom:auto}
  #nav,#navtoggle{display:none}
  #detail{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));height:58vh;z-index:15}
  #impact{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<canvas id="cv" aria-label="Codebase map canvas"></canvas>
<div id="stat"></div>

<header id="bar" aria-label="Map controls">
  <div class="search">
    <svg class="tk-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.75a4.25 4.25 0 1 1 0 8.5 4.25 4.25 0 0 1 0-8.5zM10.1 10.1l3.4 3.4"/></svg>
    <input id="q" class="tk-input" data-size="sm" type="search" placeholder="Find a file" autocomplete="off" spellcheck="false" aria-label="Find a file">
    <span class="kbd">/</span>
    <div id="results" class="panel" hidden role="listbox"></div>
  </div>
  <button id="t-show" class="tk-button bar-trigger" data-variant="ghost" data-size="sm" type="button" popovertarget="m-show" aria-haspopup="menu" title="Which files to show" hidden>
    <svg class="tk-icon" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.75a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5z"/><path class="tk-icon-fill" d="M8 6.25a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5z"/></svg>
    <span class="bar-value"></span>
    <svg class="tk-icon bar-chevron" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
  </button>
  <button id="t-scope" class="tk-button bar-trigger" data-variant="ghost" data-size="sm" type="button" popovertarget="m-scope" aria-haspopup="menu" title="Folder">
    <svg class="tk-icon" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.25 3.75h4.25l1.5 1.5h5.75v7H2.25z"/></svg>
    <span class="bar-value"></span>
    <svg class="tk-icon bar-chevron" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
  </button>
  <button id="t-filter" class="tk-button bar-trigger" data-variant="ghost" data-size="sm" type="button" popovertarget="m-filter" aria-haspopup="menu">
    <svg class="tk-icon" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 8C3.4 5.2 5.5 3.75 8 3.75s4.6 1.45 6.25 4.25C12.6 10.8 10.5 12.25 8 12.25S3.4 10.8 1.75 8z"/><path class="tk-icon-fill" d="M8 6.25a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5z"/></svg>
    <span class="bar-label">Files</span><span class="bar-badge" hidden></span>
    <svg class="tk-icon bar-chevron" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
  </button>
  <button id="t-links" class="tk-button bar-trigger" data-variant="ghost" data-size="sm" type="button" popovertarget="m-links" aria-haspopup="menu">
    <svg class="tk-icon" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM4 10.5a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM12 2a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM4 5.5v5M12 5.5c0 3.75-2.5 6.75-6.25 6.75"/></svg>
    <span class="bar-label">Imports</span>
    <svg class="tk-icon bar-chevron" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
  </button>
  <button id="t-arrange" class="tk-button bar-trigger" data-variant="ghost" data-size="sm" type="button" popovertarget="m-arrange" aria-haspopup="menu">
    <svg class="tk-icon" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h10M3 11h10M6 3v4M10 9v4"/></svg>
    <span class="bar-label">Arrange</span>
    <svg class="tk-icon bar-chevron" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
  </button>
  <div class="seg tk-toggle-group" data-size="sm" id="seg-view" role="group" aria-label="Projection">
    <button class="tk-toggle" data-v="2d" aria-pressed="false">Flat</button>
    <button class="tk-toggle" data-v="3d" aria-pressed="true" title="Orthographic 3D: each file rises by its page count. Alt/Option-drag or right-drag to orbit.">3D</button>
  </div>
</header>
<div id="m-show" class="menu tk-popup tk-list-popup tk-menu-popup" data-size="sm" popover role="menu" aria-label="Which files to show"></div>
<div id="m-scope" class="menu tk-popup tk-list-popup tk-menu-popup" data-size="sm" popover role="menu" aria-label="Folder"></div>
<div id="m-filter" class="menu tk-popup tk-list-popup tk-menu-popup" data-size="sm" popover role="menu" aria-label="Files"></div>
<div id="m-links" class="menu tk-popup tk-list-popup tk-menu-popup" data-size="sm" popover role="menu" aria-label="Imports"></div>
<div id="m-arrange" class="menu tk-popup tk-list-popup tk-menu-popup" data-size="sm" popover role="menu" aria-label="Arrange"></div>
<template id="legend">
  <div class="legend"><span><i style="background:var(--tk-blue)"></i>imports</span><span><i style="background:var(--tk-orange)"></i>imported by</span><span><i style="background:repeating-linear-gradient(90deg,var(--text-dim) 0 3px,transparent 3px 5px)"></i>type-only</span></div>
  <div class="legend" data-diff><span><i style="background:var(--added)"></i>new import</span><span><i style="background:repeating-linear-gradient(90deg,var(--deleted) 0 3px,transparent 3px 5px)"></i>removed import</span><span><i style="background:var(--tk-purple)"></i>blast radius</span><span><i style="background:var(--text-faint)"></i>linked</span></div>
</template>

<div id="br">
  <canvas id="nav" aria-label="Overview"></canvas>
  <div class="zoom">
    <button class="tk-button" data-variant="ghost" data-size="sm" data-square id="zout" aria-label="Zoom out">−</button>
    <span id="zl">100%</span>
    <button class="tk-button" data-variant="ghost" data-size="sm" data-square id="zin" aria-label="Zoom in">+</button>
    <button class="tk-button" data-variant="ghost" data-size="sm" id="zfit" title="Fit everything (F)">Fit</button>
    <button class="tk-button" data-variant="ghost" data-size="sm" data-square id="navtoggle" aria-controls="nav" aria-expanded="true" title="Hide overview">
      <svg class="tk-icon" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
  </div>
</div>

<aside id="detail" class="panel" hidden aria-label="File details"></aside>
<div id="impact" class="panel" hidden role="status"></div>
<div id="tip" class="panel" hidden></div>
<div id="hint" class="panel"><b>Drag</b> to pan · <b>⌘/Ctrl + scroll</b> or pinch to zoom · <b>Click</b> a file to spread out its pages and trace its imports</div>

<script>
// Runs the viewer once the review posts the map, so the frame stays sandboxed and the map never sits in its HTML.
addEventListener('message', function boot(event) {
  if (event.source !== parent || !event.data || event.data.type !== 'tk-review:codemap') return;
  removeEventListener('message', boot);
  const CODEMAP = event.data;
  for (const [name, value] of Object.entries(CODEMAP.theme || {})) document.documentElement.style.setProperty(name, value);
  /*__APP__*/
});
parent.postMessage({ type: 'tk-review:codemap-ready' }, '*');
</script>
</body>
</html>
